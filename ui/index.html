<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlendIf.ai - Vertical Slice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1a1a1a;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            gap: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.assistant {
            background: #1e293b;
            color: #e0e0e0;
            align-self: flex-start;
        }

        .message.error {
            background: #7f1d1d;
            color: #fca5a5;
            align-self: flex-start;
        }

        .message.loading {
            background: #1e293b;
            color: #888;
            align-self: flex-start;
            font-style: italic;
        }

        .input-container {
            background: #1a1a1a;
            padding: 16px 24px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: #2563eb;
        }

        .send-button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            color: #666;
            margin-top: 100px;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #888;
        }

        .welcome p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>BlendIf.ai - Vertical Slice</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connected</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <h2>Welcome to BlendIf.ai</h2>
            <p>Type a Blender command to get started</p>
            <p style="margin-top: 8px; font-size: 12px;">Examples: "create a cube", "create a sphere"</p>
        </div>
    </div>

    <div class="input-container">
        <input 
            type="text" 
            class="input-box" 
            id="inputBox" 
            placeholder="Type your command... (e.g., 'create a cube')"
            autocomplete="off"
        />
        <button class="send-button" id="sendButton">Send</button>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const chatContainer = document.getElementById('chatContainer');
        const inputBox = document.getElementById('inputBox');
        const sendButton = document.getElementById('sendButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let isConnected = true;

        // Add message to chat
        function addMessage(text, type = 'assistant') {
            const welcome = chatContainer.querySelector('.welcome');
            if (welcome) welcome.remove();

            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            chatContainer.appendChild(message);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return message;
        }

        // Send command
        async function sendCommand() {
            const text = inputBox.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            inputBox.value = '';
            sendButton.disabled = true;

            // Add loading message
            const loadingMsg = addMessage('Processing...', 'loading');

            try {
                const response = await fetch(`${API_URL}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                // Remove loading message
                loadingMsg.remove();

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.result, 'assistant');
                    updateStatus(true);
                } else {
                    addMessage(`Error: ${response.status} - ${response.statusText}`, 'error');
                    updateStatus(false);
                }
            } catch (error) {
                loadingMsg.remove();
                addMessage(`Connection error: ${error.message}`, 'error');
                updateStatus(false);
            } finally {
                sendButton.disabled = false;
                inputBox.focus();
            }
        }

        // Update connection status
        function updateStatus(connected) {
            isConnected = connected;
            if (connected) {
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendCommand);
        inputBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        // Check connection on load
        fetch(`${API_URL}/health`)
            .then(() => updateStatus(true))
            .catch(() => updateStatus(false));

        // Focus input on load
        inputBox.focus();
    </script>
</body>
</html>
